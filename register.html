<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>领取号码券 · 黄继安 &amp; 聂玮婷</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
  body{background:var(--ivory)}
  .page{padding:0 0 60px;align-items:center}

  /* ================= 领券表单 ================= */
  .hero{
    width:100%;max-width:460px;padding:56px 28px 0;text-align:center;position:relative;
  }
  .hero .monogram{
    font-family:var(--serif);font-size:52px;line-height:1;color:var(--ink);
    letter-spacing:.06em;
  }
  .hero .monogram em{font-style:italic;color:var(--gold);font-size:40px;padding:0 6px}
  .hero .names{
    font-family:var(--serif);font-size:24px;letter-spacing:.32em;text-indent:.32em;
    margin-top:18px;color:var(--ink);
  }
  .hero .date{margin-top:10px;font-size:13px;letter-spacing:.4em;text-indent:.4em;color:var(--ink-soft)}
  .card{
    width:100%;max-width:460px;margin-top:36px;padding:0 28px;
  }
  .form-box{
    background:var(--paper);border:1px solid var(--hairline);border-radius:6px;
    padding:34px 26px 30px;box-shadow:var(--shadow-soft);position:relative;
  }
  .form-box::before,.form-box::after{
    content:"";position:absolute;left:10px;right:10px;height:1px;background:var(--hairline);
  }
  .form-box::before{top:6px}.form-box::after{bottom:6px}
  .form-title{
    text-align:center;font-family:var(--serif);font-size:20px;letter-spacing:.24em;
    text-indent:.24em;margin-bottom:6px;
  }
  .form-sub{text-align:center;font-size:12px;color:var(--ink-soft);letter-spacing:.12em;margin-bottom:26px}
  .btn-block{width:100%;margin-top:8px}
  .err{
    display:none;background:#F9EEEA;border:1px solid #E4C4BC;color:var(--red-deep);
    font-size:13px;padding:10px 14px;border-radius:3px;margin-bottom:16px;letter-spacing:.05em;
  }
  .err.show{display:block}
  .note{
    margin-top:22px;text-align:center;font-size:12px;color:var(--ink-soft);letter-spacing:.08em;line-height:2;
  }

  /* ================= 号码券 ================= */
  .ticket-wrap{width:100%;max-width:420px;padding:26px 22px 0;display:none}
  .ticket-wrap.show{display:block;animation:ticketIn .8s cubic-bezier(.22,1,.36,1) both}
  @keyframes ticketIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
  .ticket{
    background:var(--paper);border-radius:10px 10px 0 0;overflow:hidden;
    box-shadow:0 18px 50px rgba(123,94,60,.22);position:relative;
    border:1px solid rgba(140,106,51,.25);border-bottom:none;
  }
  /* 券头：婚礼照片 + 暖色蒙版 */
  .ticket-photo{
    position:relative;height:270px;
    background:url("assets/img/poster.jpg") center 22%/cover no-repeat;
  }
  .ticket-photo::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(59,32,20,.52) 0%,rgba(80,45,30,.3) 38%,rgba(120,60,40,.14) 52%,rgba(250,246,236,.6) 78%,var(--paper) 100%);
  }
  .ticket-photo::after{
    content:"";position:absolute;inset:0;background:rgba(185,142,78,.14);mix-blend-mode:multiply;
  }
  .ticket-head{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:34px;z-index:2;
  }
  .ticket-head .m{
    font-family:var(--serif);font-size:34px;color:#FFF8E8;letter-spacing:.05em;
    text-shadow:0 2px 14px rgba(59,32,20,.55);
  }
  .ticket-head .m em{font-style:italic;color:var(--gold-light);font-size:26px;padding:0 4px}
  .ticket-head .n{
    font-family:var(--serif);font-size:19px;color:#FFF8E8;letter-spacing:.34em;text-indent:.34em;
    margin-top:12px;text-shadow:0 2px 12px rgba(59,32,20,.6);
  }
  .ticket-head .d{
    font-size:11px;color:#F5E9CE;letter-spacing:.42em;text-indent:.42em;margin-top:9px;
    text-shadow:0 1px 8px rgba(59,32,20,.5);
  }
  /* 券身 */
  .ticket-body{padding:30px 30px 26px;text-align:center;position:relative}
  .avatar{
    width:138px;height:138px;margin:-96px auto 0;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#FFFDF6 0%,#F3EAD6 100%);
    border:1px solid var(--gold);box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--hairline),0 10px 24px rgba(123,94,60,.18);
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;z-index:3;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  .ticket-label{margin-top:20px}
  .lucky{
    margin-top:6px;display:flex;align-items:center;justify-content:center;gap:14px;
  }
  .seal{
    width:44px;height:44px;border-radius:8px;background:var(--red);color:#FBEFD8;
    font-family:var(--serif);font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(251,239,216,.5);transform:rotate(-4deg);flex:none;
  }
  .lucky-num{
    font-family:var(--serif);font-weight:700;font-size:84px;line-height:1;letter-spacing:.06em;
    background:var(--gold-foil);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .lucky-cap{font-size:11px;letter-spacing:.5em;text-indent:.5em;color:var(--gold-deep);margin-top:8px;font-weight:600}
  .ticket-name{
    margin-top:18px;font-family:var(--serif);font-size:21px;letter-spacing:.2em;text-indent:.2em;
  }
  .ticket-tip{margin-top:8px;font-size:12px;color:var(--ink-soft);letter-spacing:.16em}
  /* 撕裂线 */
  .tear{
    position:relative;height:26px;background:var(--paper);
    border-left:1px solid rgba(140,106,51,.25);border-right:1px solid rgba(140,106,51,.25);
  }
  .tear::before{
    content:"";position:absolute;left:14px;right:14px;top:50%;
    border-top:2px dashed rgba(140,106,51,.5);
  }
  .tear i{
    position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--ivory);
    transform:translateY(-50%);border:1px solid rgba(140,106,51,.25);
  }
  .tear i.l{left:-14px;border-left-color:transparent}
  .tear i.r{right:-14px;border-right-color:transparent}
  /* 存根 */
  .stub{
    background:var(--cream);border:1px solid rgba(140,106,51,.25);border-top:none;
    border-radius:0 0 10px 10px;padding:18px 26px 20px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 18px 50px rgba(123,94,60,.14);
  }
  .stub .k{font-size:10px;letter-spacing:.3em;color:var(--ink-soft)}
  .stub .v{font-family:var(--serif);font-size:22px;letter-spacing:.22em;color:var(--ink);margin-top:2px}
  .stub .right{text-align:right}
  .shot-tip{
    margin-top:26px;text-align:center;font-size:13px;color:var(--gold-deep);
    letter-spacing:.2em;line-height:2.1;
  }
  .shot-tip b{color:var(--red)}
  /* 枝叶装饰 */
  .sprig{position:absolute;z-index:1;opacity:.55}
</style>
</head>
<body>
<div class="page">

  <!-- ========== 表单状态 ========== -->
  <div class="hero" id="heroBox">
    <div class="eyebrow">WEDDING LOTTERY</div>
    <div class="monogram" style="margin-top:14px">H<em>&amp;</em>N</div>
    <div class="names" id="heroNames">黄继安 · 聂玮婷</div>
    <div class="date" id="heroDate">2026.10.25</div>
    <div class="hairline"></div>
  </div>

  <div class="card" id="formCard">
    <div class="form-box">
      <div class="form-title">领取幸运号码券</div>
      <div class="form-sub">每位宾客限领一张 · 凭券参与现场抽奖</div>
      <div class="err" id="errBox"></div>
      <div class="field">
        <label>您的姓名</label>
        <input id="inName" maxlength="12" placeholder="请填写真实姓名，中奖核对用" autocomplete="name">
      </div>
      <div class="field">
        <label>手机号码</label>
        <input id="inPhone" maxlength="11" inputmode="numeric" placeholder="11 位手机号，防代领 / 方便联系" autocomplete="tel">
      </div>
      <div class="field">
        <label>祝福语（选填）</label>
        <textarea id="inWish" rows="2" maxlength="60" placeholder="写一句祝福送给新人吧"></textarea>
      </div>
      <button class="btn btn-gold btn-block" id="btnDraw">领取我的号码券</button>
    </div>
    <div class="note">号码由系统按签到顺序发放，全程唯一<br>同一部手机重复扫码将显示同一张券</div>
  </div>

  <!-- ========== 号码券状态 ========== -->
  <div class="ticket-wrap" id="ticketWrap">
    <div class="ticket" id="ticketCard">
      <div class="ticket-photo">
        <div class="ticket-head">
          <div class="m">H<em>&amp;</em>N</div>
          <div class="n" id="tkNames">黄继安 · 聂玮婷</div>
          <div class="d" id="tkDate">2026.10.25</div>
        </div>
      </div>
      <div class="ticket-body">
        <div class="avatar"><img src="assets/img/cartoon.jpg" alt="新人卡通形象" onerror="this.style.display='none'"></div>
        <div class="ticket-label eyebrow">LUCKY NUMBER</div>
        <div class="lucky">
          <span class="seal">囍</span>
          <span class="lucky-num" id="tkNum">000</span>
        </div>
        <div class="lucky-cap" id="tkNumCap">No.000</div>
        <div class="ticket-name" id="tkName">—</div>
        <div class="ticket-tip">请截图保存 · 凭此券兑奖</div>
      </div>
    </div>
    <div class="tear"><i class="l"></i><i class="r"></i></div>
    <div class="stub">
      <div>
        <div class="k">防伪验证码</div>
        <div class="v" id="tkCode">----</div>
      </div>
      <div class="right">
        <div class="k">券编号</div>
        <div class="v" id="tkStubNum">No.000</div>
      </div>
    </div>
    <div class="shot-tip"><b>长按屏幕截图保存此券</b><br>中奖后凭截图 + 防伪码到签到台兑奖</div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="assets/js/storage.js"></script>
<script>
(async function(){
  const cfg = await WL.getConfig();
  document.getElementById('heroNames').textContent = cfg.groom + ' · ' + cfg.bride;
  document.getElementById('tkNames').textContent = cfg.groom + ' · ' + cfg.bride;
  const dateTxt = cfg.date + (cfg.venue ? ' · ' + cfg.venue : '');
  document.getElementById('heroDate').textContent = dateTxt;
  document.getElementById('tkDate').textContent = dateTxt;

  const toast = (msg)=>{ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); };
  const showErr = (msg)=>{ const e=document.getElementById('errBox'); e.textContent=msg; e.classList.add('show'); };

  /* 券面素材池：每个号码固定抽到同一组（重扫不变，不同号码不同款）
     pos = 背景图纵向焦点（按每张图的构图逐张标定，保证新人面部在可视区） */
  const CARTOONS = ['cartoon','cartoon2','cartoon3','cartoon4','cartoon5','cartoon6',
                    'cartoon7','cartoon8','cartoon9','cartoon10','cartoon11']
                    .map(n=>'assets/img/'+n+'.jpg');
  const TICKET_BGS = [
    {src:'assets/img/poster.jpg', pos:'center 20%'},   // 红底囍字海报：面部在上部
    {src:'assets/img/bg1.jpg',    pos:'center 22%'},   // 树下亲吻：面部偏上
    {src:'assets/img/bg2.jpg',    pos:'center 58%'},   // 草坪挥手：人物在中下段
    {src:'assets/img/bg3.jpg',    pos:'center 38%'},   // 牵手奔跑（横图）：人物中段
    {src:'assets/img/bg4.jpg',    pos:'center 38%'},   // 依偎：人物中段偏上
  ];
  function pickByNum(arr, num){
    const n = parseInt(num, 10);
    return arr[(isNaN(n)?0:n) % arr.length];
  }

  function renderTicket(g, existed){
    const bg = pickByNum(TICKET_BGS, g.num);
    const photoEl = document.querySelector('#ticketCard .ticket-photo');
    photoEl.style.backgroundImage = 'url("'+bg.src+'")';
    photoEl.style.backgroundPosition = bg.pos;
    document.querySelector('#ticketCard .avatar img').src = pickByNum(CARTOONS, g.num);
    document.getElementById('tkNum').textContent = g.num;
    document.getElementById('tkNumCap').textContent = 'No.' + g.num;
    document.getElementById('tkStubNum').textContent = 'No.' + g.num;
    document.getElementById('tkName').textContent = g.name;
    document.getElementById('tkCode').textContent = g.code;
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('ticketWrap').classList.add('show');
    if (existed) toast('您已领取过号码券，这是您的那一张');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  const btn = document.getElementById('btnDraw');
  let submitting = false;
  btn.addEventListener('click', async ()=>{
    if (submitting) return;
    document.getElementById('errBox').classList.remove('show');
    submitting = true; btn.textContent = '正在领取…'; btn.style.opacity = .7;
    try {
      const r = await WL.register(
        document.getElementById('inName').value,
        document.getElementById('inPhone').value,
        document.getElementById('inWish').value
      );
      if (r.error){ showErr(r.error); return; }
      renderTicket(r.guest, r.existed);
    } finally {
      submitting = false; btn.textContent = '领取我的号码券'; btn.style.opacity = 1;
    }
  });

  // 本机已领过 → 直接展示票（指纹判定，服务器集中查询）
  const mine = await WL.lookup(WL.fingerprint());
  if (mine) renderTicket(mine, true);
})();
</script>
</body>
</html>
