server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 文本资源 gzip（html 默认包含）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 字体 / 图片 / 音频：长缓存（文件名不变，更新时改内容需刷新缓存，故 7 天）
    location ~* \.(jpg|jpeg|png|gif|webp|m4a|mp3|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 字体 CSS：短缓存
    location = /fonts/fonts.css {
        expires 1d;
        add_header Cache-Control "public";
    }

    # HTML 不缓存，保证新版本立即可见
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------
    # 婚礼抽奖系统（/opt/wedding-lottery，容器 wedding-lottery）
    #   http://huangnie1025.natapp4.cc/lottery/
    # ^~ 保证不被上面静态资源的正则 location 抢走
    # 后端全部相对路径，proxy_pass 带尾斜杠剥掉 /lottery/ 前缀
    # 注意：本 nginx 在容器里，127.0.0.1 是容器自己；
    #       抽奖端口绑在宿主机 docker0 网关 172.17.0.1:8061，从这里进
    # ------------------------------------------------------------
    location = /lottery { return 301 /lottery/; }

    location ^~ /lottery/ {
        proxy_pass http://172.17.0.1:8061/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE（/lottery/api/events）必需：禁缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
