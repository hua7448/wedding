<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>奖项配置 · 黄继安 &amp; 聂玮婷</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
  body{background:var(--ivory)}
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:34px 20px 80px}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .topbar .t{font-family:var(--serif);font-size:24px;letter-spacing:.2em}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav a{font-size:12px;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;
    border:1px solid var(--hairline);border-radius:100vw;padding:7px 16px;transition:all .25s}
  .nav a:hover{border-color:var(--gold);color:var(--gold-deep)}
  .box{background:var(--paper);border:1px solid var(--hairline);border-radius:6px;
    padding:26px 24px;margin-top:22px;box-shadow:var(--shadow-soft)}
  .box h2{font-family:var(--serif);font-size:17px;letter-spacing:.24em;font-weight:700;margin-bottom:18px;
    display:flex;align-items:center;gap:12px}
  .box h2::after{content:"";flex:1;height:1px;background:var(--hairline)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}

  .prize-row{
    display:grid;grid-template-columns:1.1fr .7fr .7fr 1.6fr auto;gap:10px;align-items:end;
    padding:14px 0;border-bottom:1px dashed var(--hairline);
  }
  .prize-row label{display:block;font-size:10px;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:5px}
  .prize-row input{width:100%;padding:9px 10px;font-size:14px;background:var(--ivory);
    border:1px solid var(--hairline);border-radius:3px;color:var(--ink);outline:none}
  .prize-row input:focus{border-color:var(--gold)}
  .del-btn{border:none;background:transparent;color:var(--ink-soft);font-size:18px;cursor:pointer;
    padding:6px 8px;line-height:1}
  .del-btn:hover{color:var(--red)}
  .row-head{font-size:11px;color:var(--gold-deep);letter-spacing:.14em}
  @media(max-width:560px){.prize-row{grid-template-columns:1fr 1fr;row-gap:6px}}
  .note{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;line-height:2;margin-top:12px}

  .gate{position:fixed;inset:0;background:var(--ivory);z-index:500;display:flex;
    align-items:center;justify-content:center;padding:20px}
  .gate.hide{display:none}
  .gate-card{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--hairline);
    border-radius:6px;padding:40px 32px;text-align:center;box-shadow:var(--shadow-soft)}
  .gate-card .m{font-family:var(--serif);font-size:34px;margin-bottom:6px}
  .gate-card .m em{font-style:italic;color:var(--gold);font-size:26px}
  .gate-card p{font-size:12px;color:var(--ink-soft);letter-spacing:.2em;margin-bottom:24px}
  .gate-card .err{color:var(--red);font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="m">H<em>&amp;</em>N</div>
    <p>奖项配置 · 请输入管理密码</p>
    <div class="field"><input id="passIn" type="password" placeholder="管理密码（默认 hn2026）"></div>
    <button class="btn btn-gold" style="width:100%" id="passBtn">进入配置</button>
    <div class="err" id="passErr">密码不正确</div>
  </div>
</div>

<div class="wrap" id="app" style="visibility:hidden">
  <div class="topbar">
    <div class="t">奖项与婚礼信息配置</div>
    <div class="nav">
      <a href="admin.html">控制台</a>
      <a href="screen.html" target="_blank">大屏 ↗</a>
      <a href="index.html">首页</a>
    </div>
  </div>

  <div class="box">
    <h2>婚礼信息</h2>
    <div class="grid2">
      <div class="field"><label>新郎姓名</label><input id="cGroom"></div>
      <div class="field"><label>新娘姓名</label><input id="cBride"></div>
      <div class="field"><label>婚礼日期</label><input id="cDate" placeholder="2026.10.25"></div>
      <div class="field"><label>地点（选填）</label><input id="cVenue" placeholder="如：XX酒店 三楼宴会厅"></div>
    </div>
  </div>

  <div class="box">
    <h2>奖项设置</h2>
    <div id="prizeRows"></div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" id="btnAdd">+ 添加奖项</button>
    </div>
    <div class="note">按抽奖顺序排列（先抽的放上面，通常从小奖抽到大奖）。「每轮」指滚一次抽出几名，逐位定格；总名额 ÷ 每轮 = 抽几轮。修改后点击底部保存生效。</div>
  </div>

  <div class="box">
    <h2>管理密码</h2>
    <div class="field"><label>新密码（控制台与配置页共用）</label><input id="cPass" placeholder="默认 hn2026"></div>
  </div>

  <button class="btn btn-gold" style="width:100%;margin-top:26px" id="btnSave">保存全部配置</button>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/storage.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const toast = m => { const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); };

  WL.ready.then(()=>{ if (WL.getPass()) enter(); });
  $('passBtn').addEventListener('click', tryPass);
  $('passIn').addEventListener('keydown', e=>{ if(e.key==='Enter') tryPass(); });
  async function tryPass(){
    const ok = await WL.checkPass($('passIn').value.trim());
    if (ok){ WL.setPass($('passIn').value.trim()); enter(); }
    else $('passErr').style.display='block';
  }
  function enter(){ $('gate').classList.add('hide'); $('app').style.visibility='visible'; load(); }

  let prizes = [];
  async function load(){
    const cfg = await WL.getConfig();
    $('cGroom').value = cfg.groom; $('cBride').value = cfg.bride;
    $('cDate').value = cfg.date; $('cVenue').value = cfg.venue;
    $('cPass').value = cfg.adminPass;
    prizes = cfg.prizes.map(p=>Object.assign({}, p));
    renderPrizes();
  }
  function renderPrizes(){
    const box = $('prizeRows'); box.innerHTML='';
    prizes.forEach((p, i)=>{
      const row = document.createElement('div');
      row.className = 'prize-row';
      row.innerHTML =
        '<div><label>奖项名称</label><input data-f="name" value="'+escA(p.name)+'"></div>' +
        '<div><label>总名额</label><input data-f="count" type="number" min="1" value="'+p.count+'"></div>' +
        '<div><label>每轮抽出</label><input data-f="perRound" type="number" min="1" value="'+p.perRound+'"></div>' +
        '<div><label>奖品内容（选填）</label><input data-f="desc" value="'+escA(p.desc||'')+'" placeholder="如：戴森吹风机"></div>' +
        '<button class="del-btn" title="删除">✕</button>';
      row.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const f = inp.dataset.f;
          p[f] = (f==='name'||f==='desc') ? inp.value : Math.max(1, parseInt(inp.value)||1);
        });
      });
      row.querySelector('.del-btn').addEventListener('click', ()=>{
        if (prizes.length<=1) return toast('至少保留一个奖项');
        prizes.splice(i,1); renderPrizes();
      });
      box.appendChild(row);
    });
  }
  function escA(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  $('btnAdd').addEventListener('click', ()=>{
    prizes.push({id:'p_'+Date.now().toString(36), name:'幸运奖', count:1, perRound:1, desc:''});
    renderPrizes();
  });

  $('btnSave').addEventListener('click', async ()=>{
    const cfg = {
      groom: $('cGroom').value.trim() || '新郎',
      bride: $('cBride').value.trim() || '新娘',
      date:  $('cDate').value.trim(),
      venue: $('cVenue').value.trim(),
      adminPass: $('cPass').value.trim() || 'hn2026',
      prizes: prizes.filter(p=>p.name.trim()),
    };
    if (!cfg.prizes.length) return toast('请至少保留一个奖项');
    try {
      await WL.saveConfig(cfg);
      WL.setPass(cfg.adminPass);   // 密码可能刚被改掉，同步会话内的管理密码
      toast('配置已保存，大屏与各页面即时生效');
    } catch(e) { toast('保存失败：'+(e.message||'网络异常')); }
  });
})();
</script>
</body>
</html>
